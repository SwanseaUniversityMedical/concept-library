apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "concept-library.fullname" . }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: concept-library.example.com
spec:
  entryPoints:
    - web
  routes:
    - match: Host('concept-library.example.com')
      kind: Rule
      services:
        - name: {{ include "concept-library.fullname" . }}
          port: {{ .Values.service.port }}
          sticky:
            cookie:
              name: route