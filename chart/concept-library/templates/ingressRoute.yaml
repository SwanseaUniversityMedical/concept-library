apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "concept-library.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: traefik

spec:
  entryPoints:
    - web
  routes:
    - match: Host('{{ .Values.dns.hostName }}')
      kind: Rule
      services:
        - name: {{ include "concept-library.fullname" . }}
          port: {{ .Values.service.port }}
          sticky:
            cookie:
              name: route